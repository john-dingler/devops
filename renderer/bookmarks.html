<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarks — Dingo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f1a; --card: #13132a; --border: rgba(255,255,255,0.08);
      --accent: #c8541a; --accent-l: #e07030;
      --text: #eeeef5; --muted: #9090b0; --dim: #55556a;
      --danger: #e94560;
    }
    html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; }
    body { max-width: 780px; margin: 0 auto; padding: 40px 24px; }

    .page-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .page-header img { width: 32px; height: 32px; object-fit: contain; }
    h1 { font-size: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: var(--accent-l); }

    .toolbar {
      display: flex; gap: 10px; align-items: center; margin-bottom: 24px;
    }
    .search-input {
      flex: 1; background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 13px; font-family: inherit;
      padding: 8px 12px; outline: none; max-width: 340px;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: rgba(200,84,26,0.6); }
    .count { font-size: 12px; color: var(--dim); }

    .bm-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .bm-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px; cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      display: flex; flex-direction: column; gap: 8px; position: relative;
    }
    .bm-card:hover { border-color: rgba(200,84,26,0.4); background: #16162e; }

    .bm-card-header { display: flex; align-items: center; gap: 8px; }
    .bm-favicon { width: 20px; height: 20px; border-radius: 4px; object-fit: contain; flex-shrink: 0; }
    .bm-favicon-placeholder { width: 20px; height: 20px; font-size: 16px; flex-shrink: 0; }
    .bm-title { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .bm-url   { font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bm-date  { font-size: 10px; color: var(--dim); }

    .bm-delete {
      position: absolute; top: 8px; right: 8px;
      background: none; border: none; color: var(--dim); cursor: pointer;
      font-size: 12px; width: 20px; height: 20px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.15s, background 0.15s;
    }
    .bm-card:hover .bm-delete { opacity: 1; }
    .bm-delete:hover { background: var(--danger); color: #fff; }

    .empty-state {
      text-align: center; padding: 60px 20px; color: var(--dim);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }
    .empty-state small { font-size: 12px; margin-top: 6px; display: block; }
  </style>
</head>
<body>

<div class="page-header">
  <img src="../assets/dingo-mascot.svg" alt="Dingo" />
  <h1>Bookmarks</h1>
</div>

<div class="toolbar">
  <input class="search-input" id="search" type="text" placeholder="Search bookmarks…" autocomplete="off" />
  <span class="count" id="count"></span>
</div>

<div class="bm-grid" id="bm-grid"></div>
<div class="empty-state hidden" id="empty-state">
  <div class="icon">☆</div>
  <p>No bookmarks yet</p>
  <small>Press Ctrl+D to bookmark the current page</small>
</div>

<script>
  const d = window.dingo;
  let bookmarks = [];

  function escHtml(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function timeAgo(ts) {
    const diff = Date.now() - ts;
    if (diff < 3600000)  return `${Math.floor(diff/60000)}m ago`;
    if (diff < 86400000) return `${Math.floor(diff/3600000)}h ago`;
    if (diff < 2592000000) return `${Math.floor(diff/86400000)}d ago`;
    return new Date(ts).toLocaleDateString();
  }

  function render(filter = '') {
    const grid = document.getElementById('bm-grid');
    const empty = document.getElementById('empty-state');
    const countEl = document.getElementById('count');
    grid.innerHTML = '';

    const filtered = filter
      ? bookmarks.filter(b => (b.title||b.url).toLowerCase().includes(filter.toLowerCase()))
      : bookmarks;

    countEl.textContent = `${filtered.length} bookmark${filtered.length !== 1 ? 's' : ''}`;

    if (filtered.length === 0) {
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');

    filtered.forEach(bm => {
      const card = document.createElement('div');
      card.className = 'bm-card';

      const favicon = bm.favicon
        ? `<img class="bm-favicon" src="${escHtml(bm.favicon)}" alt="" onerror="this.style.display='none'">`
        : `<span class="bm-favicon-placeholder">★</span>`;

      card.innerHTML = `
        <div class="bm-card-header">
          ${favicon}
          <span class="bm-title">${escHtml(bm.title || bm.url)}</span>
        </div>
        <div class="bm-url">${escHtml(bm.url)}</div>
        <div class="bm-date">${bm.timestamp ? timeAgo(bm.timestamp) : ''}</div>
        <button class="bm-delete" data-url="${escHtml(bm.url)}" title="Remove bookmark">✕</button>
      `;

      card.addEventListener('click', e => {
        if (e.target.classList.contains('bm-delete')) return;
        window.location.href = bm.url;
      });

      card.querySelector('.bm-delete').addEventListener('click', async e => {
        e.stopPropagation();
        if (!d) return;
        bookmarks = await d.invoke('bookmarks:remove', { url: bm.url });
        render(document.getElementById('search').value);
      });

      grid.appendChild(card);
    });
  }

  document.getElementById('search').addEventListener('input', e => render(e.target.value));

  async function init() {
    if (!d) return;
    bookmarks = await d.invoke('bookmarks:get', {});
    render();
  }
  init();
</script>
</body>
</html>
