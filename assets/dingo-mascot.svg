<!-- Dingo Browser Mascot — placeholder SVG (replace with dingo-mascot.png for production) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8813a"/>
      <stop offset="100%" stop-color="#8b4a1a"/>
    </radialGradient>
    <radialGradient id="chest" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5e6d0"/>
      <stop offset="100%" stop-color="#d4b896"/>
    </radialGradient>
  </defs>

  <!-- Body -->
  <ellipse cx="100" cy="130" rx="42" ry="50" fill="#2a2a2a"/>
  <!-- Chest white -->
  <ellipse cx="100" cy="138" rx="22" ry="32" fill="url(#chest)"/>
  <!-- Head -->
  <ellipse cx="100" cy="75" rx="36" ry="34" fill="url(#bg)"/>
  <!-- Ears -->
  <polygon points="72,50 60,18 84,42" fill="url(#bg)"/>
  <polygon points="128,50 140,18 116,42" fill="url(#bg)"/>
  <polygon points="74,48 65,28 84,44" fill="#e88a4a" opacity="0.7"/>
  <polygon points="126,48 135,28 116,44" fill="#e88a4a" opacity="0.7"/>
  <!-- Eyes -->
  <ellipse cx="88" cy="72" rx="7" ry="7" fill="#1a1a1a"/>
  <ellipse cx="112" cy="72" rx="7" ry="7" fill="#1a1a1a"/>
  <circle cx="90" cy="70" r="2.5" fill="white"/>
  <circle cx="114" cy="70" r="2.5" fill="white"/>
  <!-- Nose -->
  <ellipse cx="100" cy="84" rx="5" ry="3.5" fill="#1a1a1a"/>
  <!-- Snout -->
  <ellipse cx="100" cy="87" rx="12" ry="8" fill="#e8a070" opacity="0.5"/>
  <!-- Jacket lapels -->
  <polygon points="80,115 88,100 100,112" fill="#1a1a1a"/>
  <polygon points="120,115 112,100 100,112" fill="#1a1a1a"/>
  <!-- Guitar (simplified) -->
  <rect x="130" y="95" width="8" height="55" rx="2" fill="#8b6914" transform="rotate(-20,134,122)"/>
  <ellipse cx="148" cy="140" rx="14" ry="18" fill="#c9842a" transform="rotate(-20,148,140)"/>
  <ellipse cx="148" cy="140" rx="8" ry="11" fill="#a0661a" transform="rotate(-20,148,140)"/>
  <!-- Fist -->
  <ellipse cx="66" cy="105" rx="14" ry="12" fill="url(#bg)"/>
  <!-- Lightning bolt -->
  <polygon points="154,55 148,70 154,70 148,85" fill="#f5c518"/>

  <!-- DINGO text -->
  <text x="100" y="192" text-anchor="middle" font-family="Arial Black, sans-serif"
        font-size="22" font-weight="900" fill="white"
        stroke="#2a1a00" stroke-width="1.5">DINGO</text>
</svg>
